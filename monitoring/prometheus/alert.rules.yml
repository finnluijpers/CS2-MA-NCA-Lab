groups:
  - name: innovatech_alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} is unreachable."

      - alert: HighCpuLoad
        expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: "CPU load is above 80% on {{ $labels.instance }}."

      - alert: SOARIntegrationTest
        expr: vector(1)
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "SOAR integration test"
          description: "Temporary test alert for the SOAR pipeline."
