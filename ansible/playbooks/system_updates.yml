
---
- name: Centralized OS Patching and System Provisioning
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Update APT repository cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages to their latest versions (REQ-NCA-P1-05)
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Install required monitoring dependencies and tooling
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - ufw
          - rsyslog
          - python3-pip
        state: present

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Generate patch audit record
      ansible.builtin.lineinfile:
        path: /var/log/patch_audit.log
        line: "{{ ansible_date_time.iso8601 }} - Security patch cycle executed successfully by Ansible."
        create: yes
        mode: '0644'

    - name: Report reboot status
      ansible.builtin.debug:
        msg: "Patching tasks completed. Reboot required: {{ reboot_required_file.stat.exists }}"
