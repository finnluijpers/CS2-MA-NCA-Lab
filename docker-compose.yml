version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus:/etc/prometheus/rules:ro
    networks:
      - lab-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - lab-net

  perses:
    image: persesdev/perses:latest
    container_name: perses
    restart: always
    ports:
      - "8080:8080"
    networks:
      - lab-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    pid: "host"
    network_mode: "host"
    volumes:
      - /:/host:ro,rslave

volumes:
  grafana-storage:

networks:
  lab-net:
    driver: bridge
